name: scrape-cron

on:
  schedule:
    # GitHubのcronはUTC。実行時刻は scripts/scrape-cron.ts 側の SCRAPE_TIMES(JST) で判定する。
    # gacha=03:00 / phone=05:00 JST。混雑帯(毎時00分)を避けて :07 に発火。
    # 07:07 JST はキャッチアップ用（GHが3:07/5:07をスキップしても当日中に取り戻す）。
    # ※ベストエフォート（数分遅延あり）。lastRunAt で本日未実行のものだけ実行する。
    - cron: '7 18 * * *'  # 18:07 UTC = 03:07 JST → gacha
    - cron: '7 20 * * *'  # 20:07 UTC = 05:07 JST → phone
    - cron: '7 22 * * *'  # 22:07 UTC = 07:07 JST → 取りこぼしのキャッチアップ
  workflow_dispatch: {}   # 手動実行（Actionsタブ →「Run workflow」）

# ワークフローの多重起動を禁止（前の実行が走っていたら重ねない）
concurrency:
  group: scrape-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # gacha フルスクレイプは約58分かかるため上限を延長（GH Actions のジョブ上限は6時間）。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run scrape-cron (予定時刻を過ぎていて本日未実行のものだけ実行)
        run: npx tsx scripts/scrape-cron.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NODE_ENV: production
