name: scrape-cron

on:
  schedule:
    # GitHubのcronはUTC。実行時刻は scripts/scrape-cron.ts 側の SCRAPE_TIMES(JST) で判定する。
    # gacha=03:00 JST / phone=05:00 JST の2回だけ発火する。
    # ※ベストエフォート（数分遅延あり）。丸ごとスキップされた日も lastRunAt により翌トリガーで取り戻す。
    - cron: '0 18 * * *'  # 18:00 UTC = 03:00 JST → gacha
    - cron: '0 20 * * *'  # 20:00 UTC = 05:00 JST → phone
  workflow_dispatch: {}   # 手動実行（Actionsタブ →「Run workflow」）

# ワークフローの多重起動を禁止（前の実行が走っていたら重ねない）
concurrency:
  group: scrape-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # gacha フルスクレイプは約58分かかるため上限を延長（GH Actions のジョブ上限は6時間）。
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run scrape-cron (予定時刻を過ぎていて本日未実行のものだけ実行)
        run: npx tsx scripts/scrape-cron.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NODE_ENV: production
