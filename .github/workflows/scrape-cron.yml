name: scrape-cron

on:
  schedule:
    # 【本番/方式B】毎時ハートビート（毎時05分）。実際の実行時刻はDBの
    # ScrapeSchedule.atTime で判定する（例 atTime='03:00' → 3:05 JST頃に実行）。
    # 管理画面で atTime を変えれば、このYAMLを触らず実行時刻を変更できる。
    # ※GitHubの定期実行はUTC・ベストエフォート（数分遅延/たまにスキップ）。
    - cron: '5 * * * *'
    # 【テスト用】5分ごと。動作確認したい時だけ一時的に有効化する。
    # - cron: '*/5 * * * *'
  workflow_dispatch: {}   # 手動実行（Actionsタブ →「Run workflow」ですぐ試せる）

# ワークフローの多重起動を禁止（前の実行が走っていたら重ねない）
concurrency:
  group: scrape-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run scrape-cron (due判定して必要時のみ実行)
        run: npx tsx scripts/scrape-cron.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          NODE_ENV: production
